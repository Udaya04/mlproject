<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Math Score Predictor</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(120deg, #dbeafe, #fdf2f8);
      font-family: "Inter", sans-serif;
      padding: 40px 0;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-weight: 700;
      font-size: 28px;
      color: #1e3a8a;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      margin-top: -6px;
      font-size: 15px;
      color: #475569;
    }

    .btn-primary {
      background: linear-gradient(90deg,#4f46e5,#3b82f6);
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: 0.25s;
    }

    .btn-primary:hover {
      transform: scale(1.04);
      background: linear-gradient(90deg,#4338ca,#2563eb);
    }

    footer {
      margin-top: 35px;
      text-align: center;
      font-size: 14px;
      color: #475569;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-10">

        <div class="glass-card">

          <div class="title">Student Math Score Predictor</div>
          <div class="subtitle">Enter details to predict the Math Score</div>

          <form action="/predictdata" method="POST" class="mt-4">

            <div class="row g-3">

              <!-- Gender -->
              <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select class="form-select" name="gender" required>
                  <option value="" selected disabled>Select</option>
                  <option value="female">Female</option>
                  <option value="male">Male</option>
                </select>
              </div>

              <!-- Race -->
              <div class="col-md-6">
                <label class="form-label">Race / Ethnicity</label>
                <select class="form-select" name="race_ethnicity" required>
                  <option value="" selected disabled>Select</option>
                  <option value="group A">Group A</option>
                  <option value="group B">Group B</option>
                  <option value="group C">Group C</option>
                  <option value="group D">Group D</option>
                  <option value="group E">Group E</option>
                </select>
              </div>

              <!-- Parental Education -->
              <div class="col-md-6">
                <label class="form-label">Parental Level of Education</label>
                <select class="form-select" name="parental_level_of_education" required>
                  <option value="" selected disabled>Select</option>
                  <option value="some high school">Some high school</option>
                  <option value="high school">High school</option>
                  <option value="some college">Some college</option>
                  <option value="associate's degree">Associate's degree</option>
                  <option value="bachelor's degree">Bachelor's degree</option>
                  <option value="master's degree">Master's degree</option>
                </select>
              </div>

              <!-- Lunch -->
              <div class="col-md-6">
                <label class="form-label">Lunch Type</label>
                <select class="form-select" name="lunch" required>
                  <option value="" selected disabled>Select</option>
                  <option value="standard">Standard</option>
                  <option value="free/reduced">Free/Reduced</option>
                </select>
              </div>

              <!-- Test Prep -->
              <div class="col-md-6">
                <label class="form-label">Test Preparation Course</label>
                <select class="form-select" name="test_preparation_course" required>
                  <option value="" selected disabled>Select</option>
                  <option value="completed">Completed</option>
                  <option value="none">None</option>
                </select>
              </div>

              <!-- Reading Score -->
              <div class="col-md-6">
                <label class="form-label">Reading Score</label>
                <input type="number" class="form-control" 
                       name="reading_score" min="0" max="100" 
                       placeholder="0 - 100" required>
              </div>

              <!-- Writing Score -->
              <div class="col-md-6">
                <label class="form-label">Writing Score</label>
                <input type="number" class="form-control" 
                       name="writing_score" min="0" max="100" 
                       placeholder="0 - 100" required>
              </div>

            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4">
              Predict Math Score
            </button>

          </form>

        </div>
        
          <h2 style="text-align:center; margin-top:20px;">
            Predicted Math Score: <strong>{{results}} </strong>
          </h2>


        <footer>
          © 2025 • Student Prediction System • India
        </footer>

      </div>
    </div>
  </div>

</body>
</html>
