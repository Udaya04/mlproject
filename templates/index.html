<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Math Score Predictor</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      font-family: "Inter", system-ui, Arial;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card-box {
      background: #ffffff;
      color: #111;
      border-radius: 16px;
      padding: 40px;
      max-width: 550px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      color: #4b5563;
      margin-bottom: 20px;
    }

    .btn-start {
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      color: white;
      border: 0;
      padding: 14px 26px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 10px;
      transition: 0.3s ease;
    }

    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: fixed;
      bottom: 12px;
      text-align: center;
      width: 100%;
      font-size: 13px;
      color: #e5e7eb;
    }
  </style>
</head>

<body>

  <div class="card-box">
    <h2 class="title">Student Math Score Predictor</h2>
    <p class="subtitle">
      Predict the math score of a student based on their background & performance.
    </p>

    <img src="https://cdn-icons-png.flaticon.com/512/201/201565.png"
      width="95" class="mb-3" alt="student icon">

    <p class="subtitle">
      Click the button below to start entering details.
    </p>

    <a href="/predictdata">
      <button class="btn-start">Start Prediction</button>
    </a>
  </div>

  <footer>
    © 2025 • Student Prediction System • India
  </footer>

</body>
</html>
